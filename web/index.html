<!doctype html>
<html lang="es" data-theme="papel">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cuaderno de viajes</title>
  <meta name="description" content="Organiza tus viajes: reservas, billetes, mapa, correos, maleta y gastos." />
  <meta name="theme-color" content="#f6f2ea" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Viajes" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    // Aplica el tema antes de pintar para evitar destellos.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('cv-prefs') || '{}');
        var t = p.theme && p.theme !== 'auto' ? p.theme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'noche' : 'papel');
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.dark = (t === 'noche' || t === 'tinta') ? '1' : '';
        document.documentElement.dataset.size = p.textSize || 'normal';
      } catch (e) {}
    })();
  </script>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app"></div>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
</body>
</html>
